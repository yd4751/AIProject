# ============================================================
# 站点坞 · https 7000~7010 -> http 6000~6010
# 由 tools/gen-nginx-conf.js 生成，共 11 组映射（偏移 -1000）。
# 平台: linux / 布局: split（含 http 级 map）
#
# 【重要】map 是 http{} 级指令，本文件必须被 include 在 nginx.conf 的 http{} 块内。
#        若 include 写在 server{} 内或 http{} 外，会报 "map directive is not allowed here"。
#        不适合这个上下文时，改用 --layout standalone（不含 map）。
#
# 部署:
#   1) 本文件放到 conf.d/（Linux）或 myconf/（Windows）
#   2) sitedock-common.conf 放到 snippets/sitedock-common.conf
#   3) 证书文件按片段顶部说明放到服务器对应路径
#   4) 把下面所有 server_name 改成你的域名（需与证书 SAN 匹配）
#   5) nginx -t && nginx -s reload
#   6) 防火墙放行 TCP 7000~7010，但不要放行 6000~6010
# ============================================================

map $http_upgrade $sitedock_conn_upgrade {
    default upgrade;
    ''      close;
}

# ------- 7000 -> 6000 -------
server {
    listen      7000 ssl;
    server_name site.example.com;

    include snippets/sitedock-common.conf;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_redirect http://127.0.0.1:6000/ https://$host:7000/;
    }
}

