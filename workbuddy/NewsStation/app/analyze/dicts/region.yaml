# - aliases 的匹配是大小写不敏感的，除非用 cs: true 标记（用于 US/UK 这类
#   小写形式是常见英文单词的缩写，必须在原文中以大写出现才命中）。
# - 国籍形容词（Chinese/American 等）在新闻标题里是强地区信号，保留。
