  any: [起诉, 诉讼, 控告, 索赔, 判决, 裁定, 罚单, 处罚, 调查, 立案, 反垄断, 合规审查,
        lawsuit, sued, sues, litigation, class action, antitrust, probe, investigation,
        investigation, fine, fined, penalty, settlement, court ruling, verdict, indictment,
        charged, charges, regulator, regulators, subpoena,
     公诉, 受贿, 刑拘, 判刑, 落马, 立案侦查]

