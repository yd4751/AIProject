# 类型词典。单个词不足以判定类型，所以支持两种模式：
#   any: 命中任意一个即得分
#   all: 每一组里的词必须全部出现（组内 AND，组间 OR），用于提升精度
# 例：只出现 "营收" 可能是行业报道；"营收"+"增长/下滑" 才是财报业绩。
- value: earnings
  label: 财报业绩
  any: [财报, 季报, 半年报, 年报, 业绩, 净利润, 营收, 毛利率, 每股收益, 预告, 指引,
        earnings, quarterly results, quarterly profit, revenue, revenues, net income,
        profit, profits, guidance, earnings call, eps, fiscal quarter, beat estimates,
        missed estimates, same-store sales]
  all:
    - [营收, 增长]
    - [revenue, growth]
    - [利润, 下滑]

- value: mna
  label: 并购融资
  # 教训：不要用「融资 + 亿元」这类单位词做组合——"60万亿元社零""融资支持"都会误命中。
  # 只收有判别力的短语：轮次、要约、收购类动词。
  any: [收购, 并购, 合并, 入股, 私有化, 要约收购, 分拆, 换股, 天使轮, 种子轮, 完成融资,
        战略融资, 投后估值, 挂牌上市, 登陆科创板,
        takeover, acquisition, acquire, acquires, merger, merges, buyout, tender offer,
        spin-off, spinoff, controlling stake, funding round, series a, series b, series c,
        seed round, pre-ipo, valuation,
     出售, 转让, 剥离, divest, sell-off]

- value: lawsuit
