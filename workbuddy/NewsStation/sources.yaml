# ---- C 组：无官方 RSS 的中文媒体（2026-11-12 实测补充）----
# 这 5 家官网都不再供应 RSS：
#   虎嗅        阿里云 WAF 的 JS 挑战页，所有路径都回同一个 16KB 挑战页（含 acw_tc）
#   36氪        36kr.com 是 SPA 空壳；官方 feed 只在 www.36kr.com 域有效
#   澎湃/早报   官网 RSS 路径返回 HTML 或 404
#   观察者      无任何 RSS，首页 HTML 可稳定提取标题+链接 → 走 type: html 解析
# 前四家改用免鉴权、直连稳定的 RSS 镜像（anyfeeder 公共源）与官方隐藏 feed；
# 均无需 Cookie / API key / 代理。镜像若失效，单源失败会被隔离，不影响其它源。

